services:
  api:
    image: ${PANEL_API_IMAGE:-ghcr.io/angjustinl/wallpaper-nas-panel-api:latest}
    environment:
      PORT: 3001
      PANEL_DB_PATH: /data/panel.sqlite
      PANEL_DEFAULT_STEAM_ACCOUNT: ${PANEL_DEFAULT_STEAM_ACCOUNT:-nas-panel-operator}
      PANEL_DEFAULT_DOWNLOAD_ROOT: ${PANEL_DEFAULT_DOWNLOAD_ROOT:-/downloads/431960}
      PANEL_DEFAULT_METADATA_LANGUAGE: ${PANEL_DEFAULT_METADATA_LANGUAGE:-en-US}
      PANEL_DEFAULT_REQUEST_INTERVAL_MS: ${PANEL_DEFAULT_REQUEST_INTERVAL_MS:-1250}
      PANEL_DEFAULT_AUTO_GENERATE_NFO: ${PANEL_DEFAULT_AUTO_GENERATE_NFO:-true}
      PANEL_DEFAULT_PROXY_ENABLED: ${PANEL_DEFAULT_PROXY_ENABLED:-false}
      PANEL_DEFAULT_PROXY_URL: ${PANEL_DEFAULT_PROXY_URL:-http://127.0.0.1:7890}
      STEAMCMD_SCRIPT_PATH: /home/steam/steamcmd/steamcmd.sh
      WORKSHOP_CONTENT_DIR: /home/steam/Steam/steamapps/workshop/content/431960
      STEAM_APP_ID: 431960
      STEAMCMD_LOCK_SOCKET_PATH: ${STEAMCMD_LOCK_SOCKET_PATH:-/data/locks/steamcmd.sock}
      STEAMCMD_BATCH_MAX_ITEMS: ${STEAMCMD_BATCH_MAX_ITEMS:-20}
    volumes:
      - panel-db:/data
      - panel-downloads:/downloads
      - ${PANEL_STEAM_DATA_SOURCE:-steam-home}:/home/steam/Steam
      - ${PANEL_STEAMCMD_INSTALL_SOURCE:-steamcmd-install}:/home/steam/steamcmd
    ports:
      - "${PANEL_API_PORT:-3001}:3001"
    restart: unless-stopped

  worker:
    image: ${PANEL_WORKER_IMAGE:-ghcr.io/angjustinl/wallpaper-nas-panel-worker:latest}
    environment:
      PANEL_DB_PATH: /data/panel.sqlite
      PANEL_DEFAULT_STEAM_ACCOUNT: ${PANEL_DEFAULT_STEAM_ACCOUNT:-nas-panel-operator}
      PANEL_DEFAULT_DOWNLOAD_ROOT: ${PANEL_DEFAULT_DOWNLOAD_ROOT:-/downloads/431960}
      PANEL_DEFAULT_METADATA_LANGUAGE: ${PANEL_DEFAULT_METADATA_LANGUAGE:-en-US}
      PANEL_DEFAULT_REQUEST_INTERVAL_MS: ${PANEL_DEFAULT_REQUEST_INTERVAL_MS:-1250}
      PANEL_DEFAULT_AUTO_GENERATE_NFO: ${PANEL_DEFAULT_AUTO_GENERATE_NFO:-true}
      PANEL_DEFAULT_PROXY_ENABLED: ${PANEL_DEFAULT_PROXY_ENABLED:-false}
      PANEL_DEFAULT_PROXY_URL: ${PANEL_DEFAULT_PROXY_URL:-http://127.0.0.1:7890}
      STEAMCMD_SCRIPT_PATH: /home/steam/steamcmd/steamcmd.sh
      WORKSHOP_CONTENT_DIR: /home/steam/Steam/steamapps/workshop/content/431960
      STEAM_APP_ID: 431960
      STEAMCMD_LOCK_SOCKET_PATH: ${STEAMCMD_LOCK_SOCKET_PATH:-/data/locks/steamcmd.sock}
      STEAMCMD_BATCH_MAX_ITEMS: ${STEAMCMD_BATCH_MAX_ITEMS:-20}
    volumes:
      - panel-db:/data
      - panel-downloads:/downloads
      - ${PANEL_STEAM_DATA_SOURCE:-steam-home}:/home/steam/Steam
      - ${PANEL_STEAMCMD_INSTALL_SOURCE:-steamcmd-install}:/home/steam/steamcmd
    restart: unless-stopped

  web:
    image: ${PANEL_WEB_IMAGE:-ghcr.io/angjustinl/wallpaper-nas-panel-web:latest}
    depends_on:
      - api
    ports:
      - "${PANEL_WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  panel-db:
  panel-downloads:
  steam-home:
  steamcmd-install:
